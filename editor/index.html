<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Folio · 이미지 편집</title>
  <link rel="stylesheet" href="/editor/editor.css">
  <script defer src="/assets/project-index.js"></script>
  <script defer src="/editor/editor.js"></script>
</head>
<body>
  <header class="masthead"><div><span class="eyebrow">SUNGMIN JUNG / LOCAL STUDIO</span><h1>이미지 편집</h1></div><div class="actions"><button id="preview" disabled>미리보기</button><button id="save" class="primary" disabled>변경 사항 저장</button></div></header>
  <div class="workspace">
    <aside><label for="project">프로젝트</label><select id="project" disabled></select><p class="hint">사진을 추가하고 순서를 바꾼 뒤 저장하세요. 저장은 로컬 홈페이지에 반영됩니다.</p><div class="rule"></div><span class="eyebrow">COVER IMAGE</span><label id="cover-slot-label" for="cover-slot" hidden>메인 이미지 위치<select id="cover-slot"></select></label><div id="cover"></div><button id="cover-upload" disabled>대표 이미지 교체</button><p class="hint">메인과 작품 목록에 함께 사용됩니다. 갤러리 사진에서도 지정할 수 있어요.</p></aside>
    <main><div class="section-heading"><div><label for="section">갤러리 구획</label><select id="section" disabled></select></div><span id="count" class="hint"></span></div>
      <div class="section-fields"><label>구획 제목<input id="section-title" disabled></label><label>구획 라벨<input id="section-label" disabled></label></div>
      <button id="dropzone" class="dropzone" disabled><strong>사진을 여기에 놓거나 클릭해서 추가</strong><span>JPG · PNG · WebP / 한 장당 최대 20 MB / 여러 장 선택 가능</span></button>
      <p class="hint">↕ 핸들로 드래그하거나 ↑ ↓ 버튼으로 순서를 바꿀 수 있습니다. 빈 프레임은 ‘사진 넣기’로 채우세요.</p>
      <div id="cards" class="cards"></div>
    </main>
  </div>
  <footer><span id="status" role="status" aria-live="polite">편집 서버에 연결하는 중…</span><button id="undo-remove" disabled>제거 취소</button><span>로컬 편집 · 원본 파일 보존</span></footer>
  <input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
  <input id="replace-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <dialog id="preview-dialog"><div class="preview-header"><span>저장 전 미리보기</span><button id="preview-refresh">변경 반영</button><button id="preview-close">닫기</button></div><iframe id="preview-frame" title="프로젝트 미리보기"></iframe></dialog>
</body>
</html>
